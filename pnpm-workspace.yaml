packages:
  # the private dev apps (the playground), from the React Epic
  - "apps/*"
  # the core (@fragiola/calendar) and one adapter per framework
  - "packages/*"
  # the site export (fragiola.com): one embed app per framework, and what they share
  - "examples/*"
  - "site"

# Dependencies allowed to run install scripts (pnpm refuses an ignored build script in CI).
allowBuilds:
  esbuild: true
  # the Angular tools' native helpers (packages/angular): their prebuilt binaries come as optional
  # dependencies, so their install scripts (node-gyp fallbacks) never need to run (as in Tree)
  "@parcel/watcher": false
  lmdb: false
  msgpackr-extract: false

# @analogjs/vite-plugin-angular imports `typescript` without declaring it: as a peer, it gets the
# TypeScript of the Angular package that installs it (6.0.3, which the Angular compiler supports),
# not the workspace's TypeScript 7 (as in Tree and Primitives)
packageExtensions:
  "@analogjs/vite-plugin-angular":
    peerDependencies:
      typescript: "*"

# Fragiola UI's vendored components (examples/react) run on Fragiola Primitives, the ecosystem's own
# package, published the day the examples were vendored: the release-age gate (D22's seven days)
# is waived for it alone, by name and exact version.
minimumReleaseAgeExclude:
  - "@fragiola/primitives-react@0.2.0"
  - "@fragiola/primitives@0.2.0"
